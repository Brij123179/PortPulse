services:
  - type: web
    name: portpulse-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r src/backend/requirements.txt
    startCommand: cd src/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORTPULSE_ENV
        value: production
      - key: PORTPULSE_HOST
        value: 0.0.0.0
      - key: PORTPULSE_CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: PORTPULSE_SECRET_KEY
        generateValue: true
      - key: PORTPULSE_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: SUPABASE_HOST
        sync: false
      - key: SUPABASE_PORT
        value: "6543"
      - key: SUPABASE_USER
        sync: false
      - key: SUPABASE_PASS
        sync: false
      - key: SUPABASE_DB
        value: "postgres"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
