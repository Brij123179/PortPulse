summary: >
  PortPulse is a predictive twin of the container port that forecasts congestion hotspots
  72 hours ahead with 33% error reduction over raw AIS, optimizes berth allocations using
  HiGHS MILP constraint solvers with zero hard constraint violations, and provides shift
  supervisors with grounded Groq LLM + Supabase RAG copilot advisories.

